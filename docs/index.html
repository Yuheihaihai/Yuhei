<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Virality Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:#000;color:#f5f5f7;min-height:100vh;min-height:100dvh;overscroll-behavior:none;
}
.app{max-width:480px;margin:0 auto;padding:0 20px 100px}
.header{padding:52px 0 8px;text-align:center}
.header h1{font-size:28px;font-weight:700;letter-spacing:-.5px;color:#fff}
.header p{font-size:14px;color:#86868b;margin-top:6px;line-height:1.4}
.input-area{margin-top:24px}
.textarea-wrap{position:relative}
.textarea-wrap textarea{
  width:100%;min-height:130px;background:#1c1c1e;border:none;border-radius:16px;
  color:#f5f5f7;padding:16px 16px 40px;font-size:17px;line-height:1.5;resize:none;
  font-family:inherit;transition:box-shadow .2s;
}
.textarea-wrap textarea::placeholder{color:#636366}
.textarea-wrap textarea:focus{outline:none;box-shadow:0 0 0 2px #0a84ff}
.char-count{position:absolute;bottom:12px;right:16px;font-size:12px;color:#636366;pointer-events:none}
.char-count.warn{color:#ff9f0a}
.char-count.over{color:#ff453a}
.settings-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:12px;font-size:13px;color:#86868b;cursor:pointer;
  -webkit-user-select:none;user-select:none;padding:4px 0;
}
.settings-toggle svg{width:14px;height:14px;fill:#86868b;transition:transform .2s}
.settings-toggle.open svg{transform:rotate(180deg)}
.settings-panel{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  max-height:0;overflow:hidden;transition:max-height .25s ease,margin .25s ease;
}
.settings-panel.open{max-height:140px;margin-top:10px}
.settings-panel input{
  background:#1c1c1e;border:none;border-radius:12px;color:#f5f5f7;
  padding:12px 14px;font-size:15px;font-family:inherit;width:100%;
}
.settings-panel input:focus{outline:none;box-shadow:0 0 0 2px #0a84ff}
.settings-panel input::placeholder{color:#636366}
.analyze-btn{
  width:100%;padding:16px;margin-top:16px;border:none;border-radius:14px;
  font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;
  background:#0a84ff;color:#fff;transition:all .15s;position:relative;overflow:hidden;
}
.analyze-btn:hover{background:#0071e3}
.analyze-btn:active{transform:scale(.98);background:#0068d6}
.analyze-btn:disabled{background:#1c1c1e;color:#48484a;cursor:default;transform:none}
.btn-row{display:flex;gap:8px;margin-top:12px}
.llm-btn{
  flex:1;padding:14px;border:none;border-radius:14px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#bf5af2,#ff375f);color:#fff;
  transition:all .15s;position:relative;overflow:hidden;
}
.llm-btn:hover{filter:brightness(1.1)}
.llm-btn:active{transform:scale(.98)}
.llm-btn:disabled{background:#1c1c1e;color:#48484a;cursor:default;transform:none;filter:none}
.llm-btn .badge{font-size:9px;background:rgba(255,255,255,.25);padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
.loading{display:none;text-align:center;padding:40px 0}
.loading-ring{
  display:inline-block;width:32px;height:32px;
  border:3px solid #333;border-top-color:#0a84ff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:#86868b;margin-top:12px}
.results{display:none;margin-top:28px;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.score-hero{text-align:center;padding:28px 0}
.ring-container{position:relative;width:140px;height:140px;margin:0 auto}
.ring-container svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#2c2c2e;stroke-width:10}
.ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring-score{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:36px;font-weight:700;letter-spacing:-1px;
}
.ring-label{font-size:12px;color:#86868b;font-weight:400}
.score-category{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  padding:6px 16px;border-radius:20px;font-size:14px;font-weight:500;
}
.impressions-row{display:flex;justify-content:center;gap:20px;margin-top:16px}
.imp-item{text-align:center}
.imp-item .val{font-size:18px;font-weight:600}
.imp-item .label{font-size:11px;color:#86868b;margin-top:2px}
.section-label{
  font-size:13px;font-weight:600;color:#86868b;text-transform:uppercase;
  letter-spacing:.8px;margin:28px 0 12px;
}
.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat-card{background:#1c1c1e;border-radius:14px;padding:14px;transition:transform .15s}
.feat-card:active{transform:scale(.97)}
.feat-card .feat-name{font-size:11px;color:#86868b;text-transform:capitalize;margin-bottom:8px}
.feat-card .feat-val{font-size:22px;font-weight:600;margin-bottom:8px}
.feat-bar{height:4px;background:#2c2c2e;border-radius:2px;overflow:hidden}
.feat-bar-fill{height:100%;border-radius:2px;transition:width .8s ease}
.weakness-list{display:flex;flex-direction:column;gap:6px}
.weakness-pill{
  display:flex;align-items:flex-start;gap:8px;
  background:#1c1c1e;border-radius:12px;padding:12px 14px;
  font-size:13px;line-height:1.4;color:#ff9f0a;
}
.weakness-pill .icon{flex-shrink:0;font-size:14px;margin-top:1px}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-card{background:#1c1c1e;border-radius:14px;padding:14px 16px;border-left:3px solid #30d158}
.rec-card .rec-header{display:flex;align-items:center;justify-content:space-between}
.rec-card .rec-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#30d158}
.rec-card .rec-delta{font-size:12px;color:#86868b}
.rec-card .rec-body{font-size:14px;color:#f5f5f7;margin-top:8px;line-height:1.5}
.rec-card .rec-body .original{color:#86868b;text-decoration:line-through;font-size:13px}
.rec-card .rec-body .rewritten{color:#30d158;font-weight:500}
.rec-card.timing{border-left-color:#0a84ff}
.rec-card.timing .rec-tag{color:#0a84ff}
.rec-card.format{border-left-color:#bf5af2}
.rec-card.format .rec-tag{color:#bf5af2}
.rec-card.trigger{border-left-color:#ff9f0a}
.rec-card.trigger .rec-tag{color:#ff9f0a}
.hooks-list{display:flex;flex-direction:column;gap:6px}
.hook-card{
  background:#1c1c1e;border-radius:14px;padding:14px 16px;
  font-size:14px;line-height:1.5;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:background .15s,transform .15s;-webkit-user-select:none;user-select:none;
}
.hook-card:active{background:#2c2c2e;transform:scale(.98)}
.hook-num{
  width:24px;height:24px;border-radius:50%;background:#0a84ff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex-shrink:0;
}
.hook-text{flex:1}
.hook-copy{font-size:12px;color:#0a84ff;white-space:nowrap;flex-shrink:0}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta-item{background:#1c1c1e;border-radius:14px;padding:14px}
.meta-item .meta-label{font-size:11px;color:#86868b;margin-bottom:4px}
.meta-item .meta-value{font-size:14px;font-weight:500}
.toast{
  position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));
  left:50%;transform:translateX(-50%) translateY(80px);
  background:#30d158;color:#000;font-weight:600;font-size:14px;
  padding:10px 24px;border-radius:100px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;
  pointer-events:none;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.history{margin-top:32px}
.history-item{
  display:flex;align-items:center;gap:12px;
  background:#1c1c1e;border-radius:14px;padding:14px 16px;
  margin-bottom:6px;cursor:pointer;transition:background .15s;
}
.history-item:active{background:#2c2c2e}
.history-score{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
}
.history-text{flex:1;font-size:13px;color:#f5f5f7;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.history-clear{font-size:13px;color:#ff453a;text-align:center;padding:8px;cursor:pointer;-webkit-user-select:none;user-select:none;margin-top:4px}
/* ===== Login Screen ===== */
.login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;padding:40px 20px;text-align:center;
}
.login-screen .login-icon{font-size:48px;margin-bottom:20px}
.login-screen h2{font-size:24px;font-weight:700;margin-bottom:8px}
.login-screen .login-sub{font-size:14px;color:#86868b;margin-bottom:32px;line-height:1.5}
.handle-input{
  width:100%;max-width:320px;padding:14px 16px;border:1px solid #3a3a3c;border-radius:14px;
  font-size:17px;font-family:inherit;background:#1c1c1e;color:#f5f5f7;
  text-align:center;outline:none;transition:border-color .2s;box-sizing:border-box;
}
.handle-input:focus{border-color:#1d9bf0}
.login-btn{
  width:100%;max-width:320px;padding:16px;margin-top:16px;border:none;border-radius:14px;
  font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;
  background:#1d9bf0;color:#fff;transition:all .15s;
}
.login-btn:active{transform:scale(.98);background:#1a8cd8}
.login-btn:disabled{background:#1c1c1e;color:#48484a;cursor:default;transform:none}
.login-error{font-size:13px;color:#ff453a;margin-top:12px;min-height:20px}
.login-footer{font-size:12px;color:#48484a;margin-top:40px}
.llm-loading{display:none;text-align:center;padding:40px 0}
.llm-loading .loading-ring{border-top-color:#bf5af2}
.llm-loading .loading-text{color:#bf5af2}
.llm-results{display:none;margin-top:20px;animation:fadeUp .4s ease}
.llm-hero{
  background:linear-gradient(135deg,#1a0a2e,#2d0a1e);
  border:1px solid #bf5af233;border-radius:18px;padding:22px;text-align:center;margin-bottom:16px;
}
.llm-hero .llm-score-big{font-size:48px;font-weight:800;background:linear-gradient(135deg,#bf5af2,#ff375f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.llm-hero .llm-score-label{font-size:13px;color:#bf5af2;margin-top:2px}
.llm-diagnosis{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:10px}
.llm-diagnosis .prob{font-size:14px;color:#bf5af2;font-weight:600;margin-bottom:8px}
.llm-diagnosis .algo{font-size:13px;color:#86868b;line-height:1.5;margin-top:8px}
.flaw-item{display:flex;align-items:flex-start;gap:6px;font-size:13px;color:#ff453a;margin:4px 0;line-height:1.4}
.strength-item{display:flex;align-items:flex-start;gap:6px;font-size:13px;color:#30d158;margin:4px 0;line-height:1.4}
.rewrite-card{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:8px;border:1px solid transparent;transition:border-color .2s}
.rewrite-card:first-child{border-color:#bf5af244}
.rewrite-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rewrite-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:6px}
.rewrite-tag.max{background:#bf5af233;color:#bf5af2}
.rewrite-tag.hook{background:#0a84ff33;color:#0a84ff}
.rewrite-tag.controversy{background:#ff9f0a33;color:#ff9f0a}
.rewrite-text{
  font-size:15px;line-height:1.6;color:#f5f5f7;white-space:pre-wrap;
  padding:12px;background:#111;border-radius:10px;margin:8px 0;cursor:pointer;
}
.rewrite-text:active{background:#222}
.rewrite-strategy{font-size:12px;color:#86868b;line-height:1.4}
.rewrite-eng{font-size:12px;color:#bf5af2;margin-top:4px}
.copy-label{font-size:11px;color:#0a84ff;cursor:pointer}
.thread-card{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:8px}
.thread-tweet{
  font-size:13px;line-height:1.5;padding:10px 12px;margin:4px 0;
  background:#111;border-radius:10px;border-left:2px solid #bf5af2;cursor:pointer;
}
.thread-tweet:active{background:#1a1a1a}
.thread-num{font-size:11px;color:#bf5af2;font-weight:600;margin-bottom:4px}
.advice-card{background:#1c1c1e;border-radius:14px;padding:16px}
.advice-row{padding:8px 0;border-bottom:1px solid #2c2c2e;font-size:13px;line-height:1.5}
.advice-row:last-child{border-bottom:none}
.advice-row .adv-label{font-size:11px;color:#86868b;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
/* ===== Past Posts Analysis ===== */
.past-section{margin-top:28px;border-top:1px solid #2c2c2e;padding-top:20px}
.past-section .past-header{font-size:16px;font-weight:600;color:#1d9bf0;margin-bottom:8px}
.past-section .past-desc{font-size:13px;color:#86868b;margin-bottom:12px;line-height:1.5}
.past-textarea{
  width:100%;min-height:180px;background:#1c1c1e;border:none;border-radius:16px;
  color:#f5f5f7;padding:16px;font-size:14px;line-height:1.6;resize:none;
  font-family:inherit;transition:box-shadow .2s;
}
.past-textarea::placeholder{color:#636366}
.past-textarea:focus{outline:none;box-shadow:0 0 0 2px #1d9bf0}
.past-btn-row{display:flex;gap:8px;margin-top:10px}
.past-fetch-btn{
  flex:0 0 auto;padding:14px 18px;border:1px solid #1d9bf0;border-radius:14px;
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
  background:transparent;color:#1d9bf0;transition:all .15s;white-space:nowrap;
}
.past-fetch-btn:hover{background:#1d9bf011}
.past-fetch-btn:active{transform:scale(.98)}
.past-fetch-btn:disabled{border-color:#48484a;color:#48484a;cursor:default;transform:none}
.past-posts-btn{
  flex:1;padding:14px;border:none;border-radius:14px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  background:#1d9bf0;color:#fff;transition:all .15s;
}
.past-posts-btn:hover{background:#1a8cd8}
.past-posts-btn:active{transform:scale(.98)}
.past-posts-btn:disabled{background:#1c1c1e;color:#48484a;cursor:default;transform:none}
.past-loading{display:none;text-align:center;padding:40px 0}
.past-loading .loading-ring{border-top-color:#1d9bf0}
.past-loading .loading-text{color:#1d9bf0}
.past-results{display:none;margin-top:20px;animation:fadeUp .4s ease}
.past-hero{
  background:linear-gradient(135deg,#0a1a2e,#0a2d1e);
  border:1px solid #1d9bf033;border-radius:18px;padding:22px;text-align:center;margin-bottom:16px;
}
.past-hero .past-title{font-size:20px;font-weight:700;color:#1d9bf0;margin-bottom:4px}
.past-hero .past-sub{font-size:13px;color:#86868b}
.top-post{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:8px;border-left:3px solid #1d9bf0}
.top-post .top-rank{font-size:11px;font-weight:700;color:#1d9bf0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.top-post .top-text{font-size:14px;line-height:1.5;color:#f5f5f7;margin-bottom:8px;white-space:pre-wrap}
.top-post .top-metrics{display:flex;gap:12px;flex-wrap:wrap}
.top-post .top-metric{font-size:12px;color:#86868b}
.top-post .top-metric span{color:#1d9bf0;font-weight:600}
.pattern-card{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:8px}
.pattern-card .pattern-title{font-size:13px;font-weight:600;color:#30d158;margin-bottom:8px}
.pattern-card .pattern-body{font-size:13px;line-height:1.5;color:#f5f5f7}
.pattern-card .pattern-item{padding:6px 0;border-bottom:1px solid #2c2c2e}
.pattern-card .pattern-item:last-child{border-bottom:none}
.content-rec{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:8px;border-left:3px solid #bf5af2}
.content-rec .rec-title{font-size:13px;font-weight:600;color:#bf5af2;margin-bottom:6px}
.content-rec .rec-text{font-size:13px;line-height:1.5;color:#f5f5f7}
</style>
</head>
<body>
<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-icon">X</div>
  <h2>Virality Engine</h2>
  <div class="login-sub" id="loginSub">Xアカウントのハンドル名を入力してログインしてください。<br>許可されたアカウントのみ利用可能です。</div>
  <input type="text" id="handleInput" class="handle-input" placeholder="@ユーザー名" autocomplete="username" autocapitalize="none" spellcheck="false">
  <button class="login-btn" id="loginBtn" onclick="handleLogin()">ログイン</button>
  <button class="login-btn oauth-btn" id="oauthBtn" style="display:none;margin-top:10px;background:#000;border:1px solid #536471" onclick="startOAuth()">Xで本人確認してログイン</button>
  <div class="login-error" id="loginError"></div>
  <div class="login-footer">許可されたユーザーのみ</div>
</div>

<!-- Main App (hidden until login) -->
<div class="app" id="mainApp" style="display:none">
  <div class="header">
    <h1>Virality Engine</h1>
    <p>Xの投稿をAIが分析し、バズる戦略を提案します。</p>
  </div>
  <div class="input-area">
    <div class="textarea-wrap">
      <textarea id="text" placeholder="投稿内容を入力..." oninput="updateCharCount()"></textarea>
      <div class="char-count" id="charCount">0 / 280</div>
    </div>
    <div class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">
      設定
      <svg viewBox="0 0 20 20"><path d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <input id="followers" type="number" placeholder="フォロワー数" value="10000">
      <input id="engrate" type="number" step="0.001" placeholder="エンゲージ率" value="0.02">
    </div>
    <button class="llm-btn" id="llmBtn" onclick="llmAnalyze()" style="width:100%;margin-top:16px">AI分析<span class="badge">Claude</span></button>
  </div>
  <div class="llm-loading" id="llmLoading">
    <div class="loading-ring"></div>
    <div class="loading-text">AIが投稿を最適化中...</div>
  </div>
  <div class="llm-results" id="llmResults"></div>
  <div class="past-section">
    <div class="past-header">過去の投稿を分析</div>
    <div class="past-desc">「自動取得」で投稿を取得するか、手動でコピー＆貼り付けしてください。</div>
    <textarea id="pastInput" class="past-textarea" placeholder="過去の投稿を貼り付け（又は自動取得ボタンを押す）"></textarea>
    <div class="past-btn-row">
      <button class="past-fetch-btn" id="pastFetchBtn" onclick="fetchPastPosts()">自動取得</button>
      <button class="past-posts-btn" id="pastPostsBtn" onclick="analyzePastPosts()">AI分析</button>
    </div>
  </div>
  <div class="past-loading" id="pastLoading">
    <div class="loading-ring"></div>
    <div class="loading-text">AIが過去の投稿を分析中...</div>
  </div>
  <div class="past-results" id="pastResults"></div>
  <div class="history" id="historySection" style="display:none">
    <div class="section-label">履歴</div>
    <div id="historyList"></div>
    <div class="history-clear" onclick="clearHistory()">履歴を削除</div>
  </div>
</div>
<div class="toast" id="toast">コピーしました！</div>

<script>
/* ==========================================================================
   VIRALITY ENGINE — AI Analysis (Claude)
   ========================================================================== */

// ---------------------------------------------------------------------------
// LLM Prompts
// ---------------------------------------------------------------------------
const LLM_SYSTEM=`You are the world's #1 X (Twitter) virality engineer.
You have reverse-engineered the X algorithm and studied 500,000+ posts that achieved 1M+ impressions.

Your ONLY goal: rewrite any post so it GUARANTEES maximum virality (1M+ impressions, 100K+ likes).

Core principles you follow:
1. HOOK — The first 5-8 words decide everything. Must trigger pattern interrupt + curiosity gap.
2. EMOTION — Posts that trigger strong emotions (awe, anger, fear, surprise) get 5-10x more shares.

4. STRUCTURE — Short lines. Visual breathing room. One idea per line. Never a wall of text.
5. CONTROVERSY — Slightly polarizing > neutral. But never offensive.
6. SOCIAL PROOF — Imply authority, data, or experience.
7. CURIOSITY GAP — Promise a revelation. Withhold just enough to force engagement.
8. CALL TO ACTION — End with engagement bait: question, challenge, or "repost if you agree."
9. TIMING — Reference current trends, zeitgeist, or pain points.
10. FORMAT — Use line breaks aggressively. No hashtags (or max 1). No links in the main body.

You respond ONLY in valid JSON. No markdown fences. No explanation outside JSON.
IMPORTANT: All text values in the JSON (diagnosis, rewrites, hooks, strategies, advice) MUST be written in Japanese (日本語).`;

// --- OAuth PKCE (requires auth proxy server) ---
function generateCodeVerifier(){
  const arr=new Uint8Array(32);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function generateCodeChallenge(v){
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function startOAuth(){
  const btn=document.getElementById('oauthBtn');
  btn.disabled=true;btn.textContent='リダイレクト中...';

  const verifier=generateCodeVerifier();
  const challenge=await generateCodeChallenge(verifier);
  const state=crypto.randomUUID();

  sessionStorage.setItem('oauth_verifier',verifier);
  sessionStorage.setItem('oauth_state',state);

  const params=new URLSearchParams({
    response_type:'code',
    client_id:OAUTH_CLIENT_ID,
    redirect_uri:OAUTH_REDIRECT,
    scope:'tweet.read users.read',
    state:state,
    code_challenge:challenge,
    code_challenge_method:'S256'
  });
  location.href='https://x.com/i/oauth2/authorize?'+params.toString();
}

async function handleOAuthCallback(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const state=params.get('state');
  if(!code)return false;

  const savedState=sessionStorage.getItem('oauth_state');
  const verifier=sessionStorage.getItem('oauth_verifier');
  if(!savedState||state!==savedState||!verifier){
    showLoginError('認証エラー: セッションが無効です。もう一度お試しください。');
    history.replaceState(null,'',OAUTH_REDIRECT);
    return true;
  }

  history.replaceState(null,'',OAUTH_REDIRECT);
  sessionStorage.removeItem('oauth_state');
  sessionStorage.removeItem('oauth_verifier');

  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='本人確認中...';

  try{
    const resp=await fetch(AUTH_PROXY,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        code:code,
        code_verifier:verifier,
        redirect_uri:OAUTH_REDIRECT,
        client_id:OAUTH_CLIENT_ID
      })
    });

    if(!resp.ok){
      const err=await resp.json().catch(()=>({}));
      throw new Error(err.error||'本人確認に失敗しました ('+resp.status+')');
    }

    const userData=await resp.json();
    const username=userData.username.toLowerCase();

    if(!ALLOWED_HANDLES.includes(username)){
      showLoginError('このアカウント (@'+userData.username+') は許可されていません。');
      btn.disabled=false;btn.textContent='ログイン';
      return true;
    }

    localStorage.setItem('ve_auth',username);
    localStorage.setItem('ve_auth_name',userData.name||username);
    showApp();
  }catch(e){
    showLoginError('認証エラー: '+e.message);
    btn.disabled=false;btn.textContent='ログイン';
  }
  return true;
}

async function fetchPastPosts(){
  const username=localStorage.getItem('ve_auth')||'';
  if(!username){showToast('ログインしてください');return;}

  const btn=document.getElementById('pastFetchBtn');
  const ta=document.getElementById('pastInput');
  btn.disabled=true;btn.textContent='取得中...';

  try{
    // X syndication API — used by embedded timelines, CORS-enabled
    const resp=await fetch(
      'https://syndication.twitter.com/srv/timeline-profile/screen-name/'+encodeURIComponent(username),
      {headers:{'Accept':'text/html'},signal:AbortSignal.timeout(10000)}
    );

    if(!resp.ok) throw new Error('取得失敗 ('+resp.status+')');

    const html=await resp.text();

    // Parse the HTML to extract tweet texts
    const doc=new DOMParser().parseFromString(html,'text/html');

    // Syndication timeline uses various selectors depending on version
    let tweets=[];

    // Try modern format: data attributes and article elements
    const articles=doc.querySelectorAll('[data-tweet-id]');
    if(articles.length){
      articles.forEach(el=>{
        const textEl=el.querySelector('.tweet-text, .timeline-Tweet-text, [data-testid="tweetText"], p');
        if(textEl) tweets.push(textEl.textContent.trim());
      });
    }

    // Fallback: try extracting from any p tags inside tweet containers
    if(!tweets.length){
      const containers=doc.querySelectorAll('.timeline-Tweet, .tweet, article');
      containers.forEach(el=>{
        const p=el.querySelector('p');
        if(p&&p.textContent.trim()) tweets.push(p.textContent.trim());
      });
    }

    // Last resort: extract all meaningful text blocks
    if(!tweets.length){
      const allP=doc.querySelectorAll('p');
      allP.forEach(p=>{
        const t=p.textContent.trim();
        if(t.length>5&&!t.startsWith('http')) tweets.push(t);
      });
    }

    if(!tweets.length) throw new Error('投稿を抽出できませんでした。手動で貼り付けてください。');

    // Deduplicate and populate textarea
    tweets=[...new Set(tweets)];
    ta.value=tweets.join('\n\n');
    showToast(tweets.length+'件の投稿を取得しました');

  }catch(e){
    if(e.name==='TimeoutError'||e.message.includes('Failed to fetch')||e.message.includes('NetworkError')||e.message.includes('TypeError')){
      showToast('自動取得できません。手動で貼り付けてください。');
    }else{
      showToast(e.message);
    }
  }finally{
    btn.disabled=false;btn.textContent='自動取得';
  }
}

    }catch(e){parsed={}}

    if(Object.keys(parsed).length===0){
      res.innerHTML='<div style="text-align:center;padding:20px;color:#ff453a">AI応答の解析に失敗しました</div>';
    }else{
      res.innerHTML=renderPastPostsAnalysis(parsed,username);
    }
    res.style.display='block';
  }catch(e){
    res.innerHTML='<div style="text-align:center;padding:20px;color:#ff453a;font-size:14px">'+escHtml(e.message)+'</div>';
    res.style.display='block';
  }finally{
    btn.disabled=false;ld.style.display='none';
    ld.querySelector('.loading-text').textContent='AIが過去の投稿を分析中...';
  }
}

function renderPastPostsAnalysis(d,username){
  let h='';

  // Hero
  h+='<div class="past-hero">';
  h+='<div class="past-title">@'+escHtml(username)+' のコンテンツ分析</div>';
  h+='<div class="past-sub">'+escHtml(d.summary||d.total_analyzed+'件の投稿を分析しました')+'</div>';
  h+='</div>';

  // Top posts
  if(d.top_posts&&d.top_posts.length){
    h+='<div class="section-label">バズりやすい投稿</div>';
    for(const p of d.top_posts){
      h+='<div class="top-post">';
      h+='<div class="top-rank">#'+p.rank+'</div>';
      h+='<div class="top-text">'+escHtml(p.text)+'</div>';
      if(p.why_good) h+='<div style="font-size:12px;color:#86868b;margin-top:8px;line-height:1.4">'+escHtml(p.why_good)+'</div>';
      h+='</div>';
    }
  }

  // Winning patterns
  if(d.winning_patterns&&d.winning_patterns.length){
    h+='<div class="section-label">勝ちパターン</div>';
    h+='<div class="pattern-card">';
    for(const p of d.winning_patterns){
      h+='<div class="pattern-item">';
      h+='<div style="font-weight:600;color:#30d158;font-size:13px">'+escHtml(p.pattern)+'</div>';
      h+='<div style="font-size:13px;color:#f5f5f7;margin-top:2px">'+escHtml(p.description)+'</div>';
      if(p.frequency) h+='<div style="font-size:11px;color:#86868b;margin-top:2px">出現頻度: '+escHtml(p.frequency)+'</div>';
      h+='</div>';
    }
    h+='</div>';
  }

  // Content recommendations
  if(d.content_recommendations&&d.content_recommendations.length){
    h+='<div class="section-label">おすすめコンテンツ戦略</div>';
    for(const r of d.content_recommendations){
      h+='<div class="content-rec">';
      h+='<div class="rec-title">'+escHtml(r.title)+'</div>';
      h+='<div class="rec-text">'+escHtml(r.description)+'</div>';
      if(r.example) h+='<div style="font-size:13px;color:#bf5af2;margin-top:8px;padding:10px;background:#111;border-radius:8px;line-height:1.5">例: '+escHtml(r.example)+'</div>';
      h+='</div>';
    }
  }

  // Avoid patterns
  if(d.avoid&&d.avoid.length){
    h+='<div class="section-label">避けるべきパターン</div>';
    h+='<div class="pattern-card">';
    for(const a of d.avoid){
      h+='<div class="pattern-item" style="color:#ff453a"><span>✕ </span>'+escHtml(a)+'</div>';
    }
    h+='</div>';
  }

  // Optimal style
  if(d.optimal_style){
    h+='<div class="section-label">最適なスタイル</div>';
    h+='<div class="advice-card">';
    if(d.optimal_style.tone) h+='<div class="advice-row"><div class="adv-label">トーン</div>'+escHtml(d.optimal_style.tone)+'</div>';
    if(d.optimal_style.length) h+='<div class="advice-row"><div class="adv-label">文字数</div>'+escHtml(d.optimal_style.length)+'</div>';
    if(d.optimal_style.format) h+='<div class="advice-row"><div class="adv-label">フォーマット</div>'+escHtml(d.optimal_style.format)+'</div>';
    if(d.optimal_style.topics&&d.optimal_style.topics.length){
      h+='<div class="advice-row"><div class="adv-label">強いトピック</div>'+d.optimal_style.topics.map(t=>escHtml(t)).join('、')+'</div>';
    }
    h+='</div>';
  }

  return h;
}
</script>

</html>
