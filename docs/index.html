<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Virality Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:#000;color:#f5f5f7;min-height:100vh;min-height:100dvh;overscroll-behavior:none;
}
.app{max-width:480px;margin:0 auto;padding:0 20px 100px}
.header{padding:52px 0 8px;text-align:center}
.header h1{font-size:28px;font-weight:700;letter-spacing:-.5px;color:#fff}
.header p{font-size:14px;color:#86868b;margin-top:6px;line-height:1.4}
.input-area{margin-top:24px}
.textarea-wrap{position:relative}
.textarea-wrap textarea{
  width:100%;min-height:130px;background:#1c1c1e;border:none;border-radius:16px;
  color:#f5f5f7;padding:16px 16px 40px;font-size:17px;line-height:1.5;resize:none;
  font-family:inherit;transition:box-shadow .2s;
}
.textarea-wrap textarea::placeholder{color:#636366}
.textarea-wrap textarea:focus{outline:none;box-shadow:0 0 0 2px #0a84ff}
.char-count{position:absolute;bottom:12px;right:16px;font-size:12px;color:#636366;pointer-events:none}
.char-count.warn{color:#ff9f0a}
.char-count.over{color:#ff453a}
.settings-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:12px;font-size:13px;color:#86868b;cursor:pointer;
  -webkit-user-select:none;user-select:none;padding:4px 0;
}
.settings-toggle svg{width:14px;height:14px;fill:#86868b;transition:transform .2s}
.settings-toggle.open svg{transform:rotate(180deg)}
.settings-panel{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  max-height:0;overflow:hidden;transition:max-height .25s ease,margin .25s ease;
}
.settings-panel.open{max-height:140px;margin-top:10px}
.settings-panel input{
  background:#1c1c1e;border:none;border-radius:12px;color:#f5f5f7;
  padding:12px 14px;font-size:15px;font-family:inherit;width:100%;
}
.settings-panel input:focus{outline:none;box-shadow:0 0 0 2px #0a84ff}
.settings-panel input::placeholder{color:#636366}
.analyze-btn{
  width:100%;padding:16px;margin-top:16px;border:none;border-radius:14px;
  font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;
  background:#0a84ff;color:#fff;transition:all .15s;position:relative;overflow:hidden;
}
.analyze-btn:hover{background:#0071e3}
.analyze-btn:active{transform:scale(.98);background:#0068d6}
.analyze-btn:disabled{background:#1c1c1e;color:#48484a;cursor:default;transform:none}
.btn-row{display:flex;gap:8px;margin-top:12px}
.llm-btn{
  flex:1;padding:14px;border:none;border-radius:14px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#bf5af2,#ff375f);color:#fff;
  transition:all .15s;position:relative;overflow:hidden;
}
.llm-btn:hover{filter:brightness(1.1)}
.llm-btn:active{transform:scale(.98)}
.llm-btn:disabled{background:#1c1c1e;color:#48484a;cursor:default;transform:none;filter:none}
.llm-btn .badge{font-size:9px;background:rgba(255,255,255,.25);padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
.loading{display:none;text-align:center;padding:40px 0}
.loading-ring{
  display:inline-block;width:32px;height:32px;
  border:3px solid #333;border-top-color:#0a84ff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:#86868b;margin-top:12px}
.results{display:none;margin-top:28px;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.score-hero{text-align:center;padding:28px 0}
.ring-container{position:relative;width:140px;height:140px;margin:0 auto}
.ring-container svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#2c2c2e;stroke-width:10}
.ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring-score{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:36px;font-weight:700;letter-spacing:-1px;
}
.ring-label{font-size:12px;color:#86868b;font-weight:400}
.score-category{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;
  padding:6px 16px;border-radius:20px;font-size:14px;font-weight:500;
}
.impressions-row{display:flex;justify-content:center;gap:20px;margin-top:16px}
.imp-item{text-align:center}
.imp-item .val{font-size:18px;font-weight:600}
.imp-item .label{font-size:11px;color:#86868b;margin-top:2px}
.section-label{
  font-size:13px;font-weight:600;color:#86868b;text-transform:uppercase;
  letter-spacing:.8px;margin:28px 0 12px;
}
.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat-card{background:#1c1c1e;border-radius:14px;padding:14px;transition:transform .15s}
.feat-card:active{transform:scale(.97)}
.feat-card .feat-name{font-size:11px;color:#86868b;text-transform:capitalize;margin-bottom:8px}
.feat-card .feat-val{font-size:22px;font-weight:600;margin-bottom:8px}
.feat-bar{height:4px;background:#2c2c2e;border-radius:2px;overflow:hidden}
.feat-bar-fill{height:100%;border-radius:2px;transition:width .8s ease}
.weakness-list{display:flex;flex-direction:column;gap:6px}
.weakness-pill{
  display:flex;align-items:flex-start;gap:8px;
  background:#1c1c1e;border-radius:12px;padding:12px 14px;
  font-size:13px;line-height:1.4;color:#ff9f0a;
}
.weakness-pill .icon{flex-shrink:0;font-size:14px;margin-top:1px}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-card{background:#1c1c1e;border-radius:14px;padding:14px 16px;border-left:3px solid #30d158}
.rec-card .rec-header{display:flex;align-items:center;justify-content:space-between}
.rec-card .rec-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#30d158}
.rec-card .rec-delta{font-size:12px;color:#86868b}
.rec-card .rec-body{font-size:14px;color:#f5f5f7;margin-top:8px;line-height:1.5}
.rec-card .rec-body .original{color:#86868b;text-decoration:line-through;font-size:13px}
.rec-card .rec-body .rewritten{color:#30d158;font-weight:500}
.rec-card.timing{border-left-color:#0a84ff}
.rec-card.timing .rec-tag{color:#0a84ff}
.rec-card.format{border-left-color:#bf5af2}
.rec-card.format .rec-tag{color:#bf5af2}
.rec-card.trigger{border-left-color:#ff9f0a}
.rec-card.trigger .rec-tag{color:#ff9f0a}
.hooks-list{display:flex;flex-direction:column;gap:6px}
.hook-card{
  background:#1c1c1e;border-radius:14px;padding:14px 16px;
  font-size:14px;line-height:1.5;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:background .15s,transform .15s;-webkit-user-select:none;user-select:none;
}
.hook-card:active{background:#2c2c2e;transform:scale(.98)}
.hook-num{
  width:24px;height:24px;border-radius:50%;background:#0a84ff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex-shrink:0;
}
.hook-text{flex:1}
.hook-copy{font-size:12px;color:#0a84ff;white-space:nowrap;flex-shrink:0}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta-item{background:#1c1c1e;border-radius:14px;padding:14px}
.meta-item .meta-label{font-size:11px;color:#86868b;margin-bottom:4px}
.meta-item .meta-value{font-size:14px;font-weight:500}
.toast{
  position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));
  left:50%;transform:translateX(-50%) translateY(80px);
  background:#30d158;color:#000;font-weight:600;font-size:14px;
  padding:10px 24px;border-radius:100px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;
  pointer-events:none;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.history{margin-top:32px}
.history-item{
  display:flex;align-items:center;gap:12px;
  background:#1c1c1e;border-radius:14px;padding:14px 16px;
  margin-bottom:6px;cursor:pointer;transition:background .15s;
}
.history-item:active{background:#2c2c2e}
.history-score{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
}
.history-text{flex:1;font-size:13px;color:#f5f5f7;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.history-clear{font-size:13px;color:#ff453a;text-align:center;padding:8px;cursor:pointer;-webkit-user-select:none;user-select:none;margin-top:4px}
/* ===== Login Screen ===== */
.login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;padding:40px 20px;text-align:center;
}
.login-screen .login-icon{font-size:48px;margin-bottom:20px}
.login-screen h2{font-size:24px;font-weight:700;margin-bottom:8px}
.login-screen .login-sub{font-size:14px;color:#86868b;margin-bottom:32px;line-height:1.5}
.handle-input{
  width:100%;max-width:320px;padding:14px 16px;border:1px solid #3a3a3c;border-radius:14px;
  font-size:17px;font-family:inherit;background:#1c1c1e;color:#f5f5f7;
  text-align:center;outline:none;transition:border-color .2s;box-sizing:border-box;
}
.handle-input:focus{border-color:#1d9bf0}
.login-btn{
  width:100%;max-width:320px;padding:16px;margin-top:16px;border:none;border-radius:14px;
  font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;
  background:#1d9bf0;color:#fff;transition:all .15s;
}
.login-btn:active{transform:scale(.98);background:#1a8cd8}
.login-btn:disabled{background:#1c1c1e;color:#48484a;cursor:default;transform:none}
.login-error{font-size:13px;color:#ff453a;margin-top:12px;min-height:20px}
.login-footer{font-size:12px;color:#48484a;margin-top:40px}
.llm-loading{display:none;text-align:center;padding:40px 0}
.llm-loading .loading-ring{border-top-color:#bf5af2}
.llm-loading .loading-text{color:#bf5af2}
.llm-results{display:none;margin-top:20px;animation:fadeUp .4s ease}
.llm-hero{
  background:linear-gradient(135deg,#1a0a2e,#2d0a1e);
  border:1px solid #bf5af233;border-radius:18px;padding:22px;text-align:center;margin-bottom:16px;
}
.llm-hero .llm-score-big{font-size:48px;font-weight:800;background:linear-gradient(135deg,#bf5af2,#ff375f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.llm-hero .llm-score-label{font-size:13px;color:#bf5af2;margin-top:2px}
.llm-diagnosis{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:10px}
.llm-diagnosis .prob{font-size:14px;color:#bf5af2;font-weight:600;margin-bottom:8px}
.llm-diagnosis .algo{font-size:13px;color:#86868b;line-height:1.5;margin-top:8px}
.flaw-item{display:flex;align-items:flex-start;gap:6px;font-size:13px;color:#ff453a;margin:4px 0;line-height:1.4}
.strength-item{display:flex;align-items:flex-start;gap:6px;font-size:13px;color:#30d158;margin:4px 0;line-height:1.4}
.rewrite-card{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:8px;border:1px solid transparent;transition:border-color .2s}
.rewrite-card:first-child{border-color:#bf5af244}
.rewrite-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rewrite-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:6px}
.rewrite-tag.max{background:#bf5af233;color:#bf5af2}
.rewrite-tag.hook{background:#0a84ff33;color:#0a84ff}
.rewrite-tag.controversy{background:#ff9f0a33;color:#ff9f0a}
.rewrite-text{
  font-size:15px;line-height:1.6;color:#f5f5f7;white-space:pre-wrap;
  padding:12px;background:#111;border-radius:10px;margin:8px 0;cursor:pointer;
}
.rewrite-text:active{background:#222}
.rewrite-strategy{font-size:12px;color:#86868b;line-height:1.4}
.rewrite-eng{font-size:12px;color:#bf5af2;margin-top:4px}
.copy-label{font-size:11px;color:#0a84ff;cursor:pointer}
.thread-card{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:8px}
.thread-tweet{
  font-size:13px;line-height:1.5;padding:10px 12px;margin:4px 0;
  background:#111;border-radius:10px;border-left:2px solid #bf5af2;cursor:pointer;
}
.thread-tweet:active{background:#1a1a1a}
.thread-num{font-size:11px;color:#bf5af2;font-weight:600;margin-bottom:4px}
.advice-card{background:#1c1c1e;border-radius:14px;padding:16px}
.advice-row{padding:8px 0;border-bottom:1px solid #2c2c2e;font-size:13px;line-height:1.5}
.advice-row:last-child{border-bottom:none}
.advice-row .adv-label{font-size:11px;color:#86868b;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-icon">X</div>
  <h2>Virality Engine</h2>
  <div class="login-sub">Xアカウントのハンドル名を入力してログインしてください。<br>許可されたアカウントのみ利用可能です。</div>
  <input type="text" id="handleInput" class="handle-input" placeholder="@ユーザー名" autocomplete="username" autocapitalize="none" spellcheck="false">
  <button class="login-btn" id="loginBtn" onclick="handleLogin()">ログイン</button>

</div>

<!-- Main App (hidden until login) -->
<div class="app" id="mainApp" style="display:none">
  <div class="header">
    <h1>Virality Engine</h1>
    <p>X post virality score &amp; optimization.<br>Runs 100% in your browser.</p>
  </div>
  <div class="input-area">
    <div class="textarea-wrap">
      <textarea id="text" placeholder="Write your post..." oninput="updateCharCount()"></textarea>
      <div class="char-count" id="charCount">0 / 280</div>
    </div>
    <div class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">
      Settings
      <svg viewBox="0 0 20 20"><path d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <input id="followers" type="number" placeholder="Followers" value="10000">
      <input id="engrate" type="number" step="0.001" placeholder="Eng rate" value="0.02">
    </div>
    <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">Analyze Post</button>
    <div class="btn-row">
      <button class="llm-btn" id="llmBtn" onclick="llmAnalyze()">AI Deep Analysis<span class="badge">Claude</span></button>
    </div>

    <div class="loading-ring"></div>
    <div class="loading-text">Analyzing...</div>
  </div>
  <div class="results" id="results"></div>
  <div class="llm-loading" id="llmLoading">
    <div class="loading-ring"></div>
    <div class="loading-text">AI is rewriting your post for 1M+ virality...</div>
  </div>
  <div class="llm-results" id="llmResults"></div>
  <div class="history" id="historySection" style="display:none">
    <div class="section-label">Recent</div>
    <div id="historyList"></div>
    <div class="history-clear" onclick="clearHistory()">Clear History</div>
  </div>
</div>
<div class="toast" id="toast">Copied!</div>

<script>
/* ==========================================================================
   VIRALITY ENGINE — 100% Client-Side JavaScript Port
   Ported from src/core/virality_engine.py
   ========================================================================== */

// ---------------------------------------------------------------------------
// Constants (from Python)
// ---------------------------------------------------------------------------
const POWER_WORDS = new Set([
  "secret","surprising","shocking","nobody","everyone","actually","truth",
  "mistake","wrong","free","instantly","proven","warning","breaking","urgent",
  "exclusive","hidden","banned","illegal","controversial","insane","genius",
  "underrated","overrated","deadly","critical","massive","ultimate",
  "revolutionary","destroyed","exposed","leaked"
]);

const STRUCTURE_PATTERNS = {
  LISTICLE:0.15, THREAD_HOOK:0.10, CONTRARIAN:0.12, STORY_OPEN:0.08,
  ONE_LINER:0.06, QUESTION:0.07, VERSUS:0.09, BEFORE_AFTER:0.11, BOLD_CLAIM:0.13
};

const WEIGHTS = {
  hook:0.20, emotion:0.15, curiosity:0.15, structure:0.12,
  readability:0.08, timing:0.10, trend:0.10, controversy:0.05, format:0.05
};

const INTERACTION_COEFFICIENTS = {
  hook_x_curiosity:0.08, trend_x_timing:0.05,
  emotion_x_controversy:0.04, controversy_penalty:-0.10
};

const IMPRESSION_BUCKETS = [
  [0.00,0.30,10000],[0.30,0.50,100000],[0.50,0.70,500000],
  [0.70,0.85,1000000],[0.85,1.00,5000000]
];

const WEAKNESS_THRESHOLDS = {
  hook_strength:0.70, emotional_intensity:0.50, curiosity_gap:0.50,
  readability_score:0.70, timing_score:0.80, trend_alignment:0.40, structure_score:0.50
};

// Sentiment word lists (lightweight VADER-like)
const POS_WORDS = new Set(["good","great","best","amazing","awesome","love","excellent","wonderful","fantastic","perfect","beautiful","happy","brilliant","outstanding","incredible","superb","nice","cool","favorite","remarkable","extraordinary","phenomenal","magnificent","superior","exceptional"]);
const NEG_WORDS = new Set(["bad","worst","terrible","horrible","hate","awful","poor","ugly","stupid","boring","fail","failure","wrong","mistake","problem","issue","broken","useless","painful","disaster","catastrophe","nightmare","toxic","garbage","pathetic"]);
const EMOTION_WORDS = {
  anger:new Set(["angry","furious","outraged","mad","infuriating","rage","livid","disgusting"]),
  fear:new Set(["afraid","scared","terrifying","dangerous","warning","threat","risk","alarming"]),
  joy:new Set(["happy","excited","thrilled","delighted","celebrating","wonderful","blessed"]),
  surprise:new Set(["shocking","unexpected","unbelievable","mindblowing","insane","crazy","wild"]),
  sadness:new Set(["sad","heartbreaking","devastating","tragic","painful","crying","loss"])
};
const CURIOSITY_PATTERNS = [
  /here'?s?\s+(why|how|what)/i, /you\s+(won'?t|wouldn'?t)\s+believe/i,
  /the\s+(real|actual|true)\s+reason/i, /nobody\s+(talks?|knows?|tells?)/i,
  /what\s+(happened|they|i)\s/i, /turns?\s+out/i, /secret/i,
  /\d+\s+(things?|reasons?|ways?|tips?|mistakes?|rules?|facts?)/i,
  /did\s+you\s+know/i, /stop\s+(doing|using|saying)/i,
  /the\s+\w+\s+that\s+\w+\s+don'?t/i, /thread/i
];

// ---------------------------------------------------------------------------
// Utility
// ---------------------------------------------------------------------------
function clamp(v,lo=0,hi=1){return Math.max(lo,Math.min(hi,v))}
function sigmoid(x){
  if(x>=0){return 1/(1+Math.exp(-x))}
  const ex=Math.exp(x);return ex/(1+ex);
}

// ---------------------------------------------------------------------------
// Feature Extraction (client-side heuristic-based)
// ---------------------------------------------------------------------------
function extractFeatures(text, followers, engRate){
  const fv = {};

  // Hook strength
  const firstLine = text.split('\n')[0].trim();
  const tokens = firstLine.toLowerCase().split(/\s+/);
  const hasNumber = tokens.some(t=>/^\d+$/.test(t)) ? 1 : 0;
  const pwCount = tokens.filter(t=>POWER_WORDS.has(t)).length;
  const powerWordRatio = pwCount / Math.max(tokens.length,1);
  const brevity = Math.max(0, 1 - firstLine.length / 100);
  const curiositySignal = curiosityGapScore(firstLine);
  const patternInterrupt = patternInterruptScore(firstLine);
  fv.hook_strength = clamp(0.20*hasNumber + 0.25*powerWordRatio + 0.20*brevity + 0.25*curiositySignal + 0.10*patternInterrupt);

  // Emotional intensity
  const words = text.split(/\s+/);
  const lowerWords = words.map(w=>w.toLowerCase().replace(/[^a-z]/g,''));
  let posCount=0, negCount=0;
  lowerWords.forEach(w=>{if(POS_WORDS.has(w))posCount++;if(NEG_WORDS.has(w))negCount++});
  const sentimentCompound = (posCount-negCount)/Math.max(words.length,1);
  let emotionMax=0;
  for(const[,eset]of Object.entries(EMOTION_WORDS)){
    const cnt=lowerWords.filter(w=>eset.has(w)).length/Math.max(words.length,1);
    if(cnt>emotionMax)emotionMax=cnt;
  }
  emotionMax = Math.min(emotionMax*5, 1);
  const exclDensity = words.filter(w=>/[!?]$/.test(w)).length / Math.max(words.length,1);
  const capsWords = words.filter(w=>w===w.toUpperCase()&&w.length>1&&/[A-Z]/.test(w)).length;
  const capsRatio = Math.min(capsWords/Math.max(words.length,1), 0.15);
  fv.emotional_intensity = clamp(0.30*Math.abs(sentimentCompound)*3 + 0.35*emotionMax + 0.20*exclDensity*5 + 0.15*capsRatio*6);

  // Curiosity gap
  fv.curiosity_gap = curiosityGapScore(text);

  // Controversy index
  const stanceWords = new Set(["always","never","everyone","nobody","only","must","wrong","right","best","worst"]);
  const stanceCount = lowerWords.filter(w=>stanceWords.has(w)).length;
  const stanceStrength = Math.min(stanceCount/Math.max(words.length,1)*10, 1);
  const controversialTopics = ["politics","religion","ai","crypto","gender","race","vaccine","climate"];
  const topicHit = controversialTopics.some(t=>text.toLowerCase().includes(t)) ? 0.3 : 0.1;
  fv.controversy_index = clamp(topicHit * stanceStrength);

  // Readability
  const sentences = text.split(/[.!?]+/).filter(s=>s.trim().length>0);
  const shortRatio = sentences.filter(s=>s.trim().split(/\s+/).length<=12).length / Math.max(sentences.length,1);
  const avgWordLen = lowerWords.reduce((a,w)=>a+w.length,0)/Math.max(lowerWords.length,1);
  const whitespaceRatio = (text.match(/\n/g)||[]).length / Math.max(text.length/50, 1);
  const fkApprox = Math.max(0, 1 - (avgWordLen*0.8 + (words.length/Math.max(sentences.length,1))*0.3)/20);
  fv.readability_score = clamp(0.4*fkApprox + 0.3*shortRatio + 0.2*Math.max(0,1-avgWordLen/10) + 0.1*Math.min(whitespaceRatio,1));

  // Structure score
  const detected = detectPatterns(text);
  if(Object.keys(detected).length===0){
    fv.structure_score=0;
  }else{
    const scores = Object.values(detected).sort((a,b)=>b-a);
    fv.structure_score = clamp(scores[0] + (scores.length>1 ? 0.3*scores[1] : 0));
  }

  // Timing (use current time)
  const now = new Date();
  const hour = now.getUTCHours();
  const dow = now.getUTCDay();
  // Engagement heatmap: peak hours 12-15 UTC (US morning), 17-21 UTC (US afternoon/evening)
  const peakHours = {8:0.6,9:0.7,10:0.7,11:0.75,12:0.85,13:0.9,14:0.9,15:0.85,16:0.8,17:0.85,18:0.9,19:0.95,20:0.9,21:0.8,22:0.7};
  const hourScore = peakHours[hour] || 0.4;
  // Weekday bonus (Tue-Thu best)
  const dowBonus = [0.85,0.9,0.95,0.95,0.9,0.8,0.8][dow];
  fv.timing_score = clamp(hourScore * dowBonus);

  // Trend alignment (heuristic: check for trending-style words)
  const trendWords = ["ai","gpt","chatgpt","openai","claude","llm","startup","founder","saas","remote","layoff","tech","bitcoin","ethereum","crypto"];
  const trendHits = lowerWords.filter(w=>trendWords.includes(w)).length;
  fv.trend_alignment = clamp(trendHits * 0.2);

  // Post length normalized
  const postLenNorm = Math.min(text.length/280, 1);

  // Media (none for text-only)
  const mediaIdx = 0;
  const mediaBonus = {0:0,1:0.15,2:0.20,3:0.08,4:0.10};
  const formatScore = clamp((mediaBonus[mediaIdx]||0) + 0.3*(1-postLenNorm));

  // Author baseline
  const followerLog = Math.log10(Math.max(followers,1));
  const authorBaseline = Math.min(followerLog/7*0.3, 0.3);

  // --- Composite Score ---
  let raw = WEIGHTS.hook * fv.hook_strength
    + WEIGHTS.emotion * fv.emotional_intensity
    + WEIGHTS.curiosity * fv.curiosity_gap
    + WEIGHTS.structure * fv.structure_score
    + WEIGHTS.readability * fv.readability_score
    + WEIGHTS.timing * fv.timing_score
    + WEIGHTS.trend * fv.trend_alignment
    + WEIGHTS.controversy * fv.controversy_index
    + WEIGHTS.format * formatScore;

  raw += INTERACTION_COEFFICIENTS.hook_x_curiosity * fv.hook_strength * fv.curiosity_gap;
  raw += INTERACTION_COEFFICIENTS.trend_x_timing * fv.trend_alignment * fv.timing_score;
  raw += INTERACTION_COEFFICIENTS.emotion_x_controversy * fv.emotional_intensity * fv.controversy_index;
  raw += INTERACTION_COEFFICIENTS.controversy_penalty * Math.max(0, fv.controversy_index - 0.7);
  raw += authorBaseline;

  const finalScore = sigmoid(raw * 5 - 2.5);

  // Impressions
  let p50=5000000, p75=8000000, p90=15000000;
  for(const[lo,hi,ceiling] of IMPRESSION_BUCKETS){
    if(finalScore>=lo && finalScore<hi){
      const frac = (finalScore-lo)/(hi-lo);
      p50=Math.floor(ceiling*frac*0.5);
      p75=Math.floor(ceiling*frac*0.8);
      p90=Math.floor(ceiling*frac*1.2);
      break;
    }
  }

  // Category
  let category;
  if(finalScore>=0.85) category='high_potential';
  else if(finalScore>=0.70) category='medium_potential';
  else if(finalScore>=0.50) category='moderate';
  else category='low_potential';

  // Weaknesses
  const weaknesses = [];
  for(const[feat,threshold] of Object.entries(WEAKNESS_THRESHOLDS)){
    const val = fv[feat]||0;
    if(val < threshold) weaknesses.push(feat+' = '+(val*100).toFixed(0)+'%');
  }

  return {
    score:{
      raw_score:raw, final_score:finalScore,
      predicted_impressions_p50:p50, predicted_impressions_p75:p75, predicted_impressions_p90:p90,
      feature_breakdown:fv, weaknesses, category
    },
    formatScore, postLenNorm, detected
  };
}

function curiosityGapScore(text){
  let score=0;
  for(const pat of CURIOSITY_PATTERNS){
    if(pat.test(text)) score+=0.15;
  }
  if(text.trim().endsWith(':')) score+=0.1;
  if(text.trim().endsWith('...')) score+=0.08;
  if(text.includes('?')) score+=0.05;
  return clamp(score);
}

function patternInterruptScore(text){
  let score=0;
  if(/^[A-Z]{2,}/.test(text)) score+=0.3;
  if(/^\d/.test(text)) score+=0.2;
  if(/[!]{2,}/.test(text)) score+=0.1;
  if(text.length<50) score+=0.15;
  if(/^(stop|don'?t|never|wrong|no one)/i.test(text)) score+=0.25;
  return clamp(score);
}

function detectPatterns(text){
  const results={};
  const lower=text.toLowerCase().trim();
  const words=lower.split(/\s+/);
  const lines=text.trim().split('\n');

  if(words[0]&&/^\d+$/.test(words[0])) results.LISTICLE=STRUCTURE_PATTERNS.LISTICLE;
  if(['🧵','thread:','(1/'].some(m=>lower.includes(m))) results.THREAD_HOOK=STRUCTURE_PATTERNS.THREAD_HOOK;
  if(['unpopular opinion','hot take','controversial take'].some(p=>lower.startsWith(p))) results.CONTRARIAN=STRUCTURE_PATTERNS.CONTRARIAN;
  if(['i just','last week','last month','in 20'].some(p=>lower.startsWith(p))) results.STORY_OPEN=STRUCTURE_PATTERNS.STORY_OPEN;
  if(words.length<=15 && lines.length===1 && !lower.includes('http')) results.ONE_LINER=STRUCTURE_PATTERNS.ONE_LINER;
  if(text.trim().endsWith('?')) results.QUESTION=STRUCTURE_PATTERNS.QUESTION;
  if(lower.includes(' vs ') || (lower.includes(' or ') && lower.endsWith('?'))) results.VERSUS=STRUCTURE_PATTERNS.VERSUS;
  if(lower.includes('before:') && lower.includes('after:')) results.BEFORE_AFTER=STRUCTURE_PATTERNS.BEFORE_AFTER;

  const hedgeWords=new Set(["maybe","perhaps","might","could","possibly","i think"]);
  const superlatives=new Set(["best","worst","most","biggest","fastest","only","never","always","every"]);
  const wordSet=new Set(words);
  if(!text.trim().endsWith('?') && ![...hedgeWords].some(h=>wordSet.has(h)) && [...superlatives].some(s=>wordSet.has(s))){
    results.BOLD_CLAIM=STRUCTURE_PATTERNS.BOLD_CLAIM;
  }
  return results;
}

// ---------------------------------------------------------------------------
// Strategy Generation (client-side)
// ---------------------------------------------------------------------------
function generateStrategy(text, fv, detected){
  const recommendations=[];
  const hooks=[];

  // Format suggestions
  const formatSugs=[];
  const lines=text.split('\n');
  if(lines[0].length>40) formatSugs.push({rule:'line_break_after_hook',action:'Insert line break after first sentence',impact:0.04});
  if((text.match(/\n/g)||[]).length>2 && !text.includes('→')) formatSugs.push({rule:'visual_separators',action:'Use → or • for scannability',impact:0.02});
  if((text.match(/#/g)||[]).length>2) formatSugs.push({rule:'remove_hashtag_spam',action:'Reduce to 0-1 hashtags; move to end',impact:0.03});
  if(formatSugs.length){
    recommendations.push({type:'format',detail:{suggestions:formatSugs},score_delta:formatSugs.reduce((a,s)=>a+s.impact,0)});
  }

  // Trigger suggestions
  const triggers=[];
  const lower=text.toLowerCase();
  if(fv.curiosity_gap<0.5 && !lower.endsWith(':')) triggers.push('curiosity_gap: End with colon or open question');
  if(!text.includes('%') && !/\d/.test(text)) triggers.push('social_proof: Add specific numbers or percentages');
  if(fv.emotional_intensity<0.5) triggers.push('loss_aversion: Reframe as what reader stands to lose');
  if(triggers.length){
    recommendations.push({type:'trigger',detail:{triggers},score_delta:0.05*triggers.length});
  }

  // Timing
  const windows=[['Tuesday','13','0.95'],['Wednesday','14','0.93'],['Thursday','12','0.90']];
  recommendations.push({type:'timing',detail:{optimal_windows:windows},score_delta:0.02});

  // Hook variants (template-based)
  const topic = extractTopic(text);
  if(fv.hook_strength < WEAKNESS_THRESHOLDS.hook_strength){
    hooks.push(
      `The shocking truth about ${topic} that nobody talks about:`,
      `I spent 1,000 hours studying ${topic}. Here's what I learned:`,
      `Stop doing ${topic} wrong. Here's what actually works:`,
      `Why 97% of people fail at ${topic} (and how to fix it):`,
      `${topic} is broken. Here's proof:`
    );
  }

  // Media recommendation
  let mediaRec = 'none_or_screenshot';
  if(Object.keys(detected).length>0) mediaRec='static_image_with_text_overlay';

  // Thread
  const wordCount=text.split(/\s+/).length;
  const threadRec = (fv.hook_strength>=0.3 && wordCount>30)
    ? {recommended:true,optimal_length:Math.min(Math.max(3,Math.floor(wordCount/40)),10)}
    : {recommended:false,optimal_length:0};

  // Hashtag
  const hashCount=(text.match(/#\w+/g)||[]).length;
  const hashStrategy = hashCount>2
    ? {use:1,tags:[(text.match(/#\w+/)||[''])[0]],note:'Reduce to max 1 hashtag'}
    : {use:hashCount,tags:(text.match(/#\w+/g)||[])};

  // Engagement bait
  let baitType='question_close';
  if(text.trim().endsWith('?')) baitType='question_already_present';
  else if(fv.controversy_index>0.5) baitType='agree_disagree';

  return {recommendations,hook_variants:hooks,media_recommendation:mediaRec,
    thread_expansion:threadRec,hashtag_strategy:hashStrategy,engagement_bait_type:baitType};
}

function extractTopic(text){
  const words=text.toLowerCase().split(/\s+/).filter(w=>w.length>3);
  const stopWords=new Set(['this','that','with','from','have','been','will','about','your','they','their','what','when','where','which','there','these','those','then','than','into','just','also','more','some','very','most','other','after','over','such','only']);
  const filtered=words.filter(w=>!stopWords.has(w.replace(/[^a-z]/g,'')));
  return filtered[0]||'this topic';
}

const ALLOWED_HANDLES=['lovejesusyt'];

function handleLogin(){
  const input=document.getElementById('handleInput');
  const raw=input.value.trim().replace(/^@/,'');
  if(!raw){
    showLoginError('ハンドル名を入力してください。');
    return;
  }
  const username=raw.toLowerCase();
  if(!ALLOWED_HANDLES.includes(username)){
    showLoginError('このアカウント (@'+raw+') は許可されていません。');
    return;
  }
  localStorage.setItem('ve_auth',username);
  localStorage.setItem('ve_auth_name',raw);
  showApp();
}

function showLoginError(msg){
  const el=document.getElementById('loginError');
  if(el)el.textContent=msg;
}

function checkSession(){
  const saved=localStorage.getItem('ve_auth');
  if(saved && ALLOWED_HANDLES.includes(saved.toLowerCase())){
    showApp();
    return true;
  }
  return false;
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
}

function logout(){
  localStorage.removeItem('ve_auth');
  localStorage.removeItem('ve_auth_name');
  location.reload();
}

    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:4096,
        system:LLM_SYSTEM,
        messages:[{role:'user',content:buildAnalyzePrompt(text,followers,score.feature_breakdown)}]
      })
    });

    if(!resp.ok){
      const errBody=await resp.text();
      throw new Error('API error '+resp.status+': '+errBody.substring(0,200));
    }

    const data=await resp.json();
    const rawText=data.content[0].text.trim();
    let parsed={};
    try{
      const start=rawText.indexOf('{');
      const end=rawText.lastIndexOf('}');
      if(start>=0&&end>start) parsed=JSON.parse(rawText.substring(start,end+1));
    }catch(e){parsed={}}

    if(Object.keys(parsed).length===0){
      res.innerHTML='<div style="text-align:center;padding:20px;color:#ff453a">Failed to parse AI response</div>';
    }else{
      res.innerHTML=renderLLM(parsed);
    }
    res.style.display='block';
  }catch(e){
    res.innerHTML='<div style="text-align:center;padding:20px;color:#ff453a;font-size:14px">'+escHtml(e.message)+'</div>';
    res.style.display='block';
  }finally{btn.disabled=false;ld.style.display='none';}
}

function renderResult(d){

  const circ=2*Math.PI*60;const offset=circ*(1-pct);
  let h='';
  h+='<div class="score-hero"><div class="ring-container">';
  h+='<svg viewBox="0 0 140 140"><circle class="ring-bg" cx="70" cy="70" r="60"/>';
  h+='<circle class="ring-fill" cx="70" cy="70" r="60" stroke="'+ringCol+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" data-target="'+offset+'"/>';
  h+='</svg><div class="ring-score" style="color:'+ringCol+'">'+(pct*100).toFixed(0)+'<br><span class="ring-label">score</span></div>';
  h+='</div><div class="score-category" style="background:'+catBg+';color:'+ringCol+'">'+catLabel(s.category)+'</div>';
  h+='<div class="impressions-row">';
  h+='<div class="imp-item"><div class="val">'+fmtNum(s.predicted_impressions_p50)+'</div><div class="label">p50</div></div>';
  h+='<div class="imp-item"><div class="val">'+fmtNum(s.predicted_impressions_p75)+'</div><div class="label">p75</div></div>';
  h+='<div class="imp-item"><div class="val">'+fmtNum(s.predicted_impressions_p90)+'</div><div class="label">p90</div></div>';
  h+='</div></div>';

  h+='<div class="section-label">Feature Breakdown</div><div class="features-grid">';
  const fnames={hook_strength:'Hook',emotional_intensity:'Emotion',curiosity_gap:'Curiosity',
    controversy_index:'Controversy',readability_score:'Readability',structure_score:'Structure',
    timing_score:'Timing',trend_alignment:'Trend'};
  for(const[k,v]of Object.entries(s.feature_breakdown)){
    const c=featColor(v);
    h+='<div class="feat-card"><div class="feat-name">'+(fnames[k]||k)+'</div>';
    h+='<div class="feat-val" style="color:'+c+'">'+(v*100).toFixed(0)+'</div>';
    h+='<div class="feat-bar"><div class="feat-bar-fill" style="width:'+(v*100)+'%;background:'+c+'"></div></div></div>';
  }
  h+='</div>';

  if(s.weaknesses&&s.weaknesses.length){
    h+='<div class="section-label">Weaknesses</div><div class="weakness-list">';
    for(const w of s.weaknesses) h+='<div class="weakness-pill"><span class="icon">!</span><span>'+escHtml(w)+'</span></div>';
    h+='</div>';
  }

  if(d.recommendations&&d.recommendations.length){
    h+='<div class="section-label">Recommendations</div><div class="rec-list">';
    for(const r of d.recommendations){
      const cls=r.type==='timing'?'timing':r.type==='format'?'format':r.type==='trigger'?'trigger':'';
      h+='<div class="rec-card '+cls+'"><div class="rec-header"><span class="rec-tag">'+r.type+'</span>';
      h+='<span class="rec-delta">'+(r.score_delta>=0?'+':'')+r.score_delta.toFixed(3)+'</span></div>';
      h+='<div class="rec-body">';
      if(r.type==='format'&&r.detail.suggestions) for(const sg of r.detail.suggestions) h+='<div>'+escHtml(sg.action)+'</div>';
      else if(r.type==='trigger'&&r.detail.triggers) for(const t of r.detail.triggers) h+='<div>'+escHtml(t)+'</div>';
      else if(r.type==='timing'&&r.detail.optimal_windows) for(const w of r.detail.optimal_windows) h+='<div>'+w[0]+' '+w[1]+':00 UTC</div>';
      h+='</div></div>';
    }
    h+='</div>';
  }

  if(d.hook_variants&&d.hook_variants.length){
    h+='<div class="section-label">Hook Variants</div><div class="hooks-list">';
    d.hook_variants.forEach((hk,i)=>{
      h+='<div class="hook-card" onclick="copyText(\''+escJs(hk)+'\')">';
      h+='<div class="hook-num">'+(i+1)+'</div><div class="hook-text">'+escHtml(hk)+'</div>';
      h+='<div class="hook-copy">Copy</div></div>';
    });
    h+='</div>';
  }

  h+='<div class="section-label">Details</div><div class="meta-grid">';
  h+='<div class="meta-item"><div class="meta-label">Media</div><div class="meta-value">'+escHtml(d.media_recommendation).replace(/_/g,' ')+'</div></div>';
  h+='<div class="meta-item"><div class="meta-label">CTA</div><div class="meta-value">'+escHtml(d.engagement_bait_type).replace(/_/g,' ')+'</div></div>';
  h+='<div class="meta-item"><div class="meta-label">Thread</div><div class="meta-value">'+(d.thread_expansion.recommended?d.thread_expansion.optimal_length+' posts':'Not needed')+'</div></div>';
  h+='<div class="meta-item"><div class="meta-label">Hashtags</div><div class="meta-value">'+(d.hashtag_strategy.tags&&d.hashtag_strategy.tags.length?d.hashtag_strategy.tags.join(' '):'None')+'</div></div>';
  h+='</div>';
  return h;
}

function renderLLM(d){
  let h='';
  h+='<div class="llm-hero"><div class="llm-score-big">'+(d.viral_score||'?')+'</div>';
  h+='<div class="llm-score-label">AI Viral Potential (post-optimization)</div></div>';

  if(d.diagnosis){
    h+='<div class="section-label">Diagnosis</div><div class="llm-diagnosis">';
    if(d.diagnosis.current_viral_probability) h+='<div class="prob">Current viral probability: '+escHtml(d.diagnosis.current_viral_probability)+'</div>';
    if(d.diagnosis.fatal_flaws) for(const f of d.diagnosis.fatal_flaws) h+='<div class="flaw-item"><span>✕</span><span>'+escHtml(f)+'</span></div>';
    if(d.diagnosis.strengths) for(const s of d.diagnosis.strengths) h+='<div class="strength-item"><span>✓</span><span>'+escHtml(s)+'</span></div>';
    if(d.diagnosis.algorithm_signals) h+='<div class="algo">Algorithm: '+escHtml(d.diagnosis.algorithm_signals)+'</div>';
    h+='</div>';
  }

  if(d.rewrites&&d.rewrites.length){
    h+='<div class="section-label">Viral Rewrites</div>';
    const tagCls={maximum_viral:'max',hook_optimized:'hook',controversy_play:'controversy'};
    const tagName={maximum_viral:'Maximum Viral',hook_optimized:'Hook Optimized',controversy_play:'Controversy Play'};
    for(const rw of d.rewrites){
      const cls=tagCls[rw.version]||'max';
      h+='<div class="rewrite-card"><div class="rewrite-label"><span class="rewrite-tag '+cls+'">'+escHtml(tagName[rw.version]||rw.version)+'</span>';
      h+='<span class="copy-label" onclick="copyText(this.parentElement.nextElementSibling.textContent)">Copy</span></div>';
      h+='<div class="rewrite-text" onclick="copyText(this.textContent)">'+escHtml(rw.text)+'</div>';
      h+='<div class="rewrite-strategy">'+escHtml(rw.strategy||'')+'</div>';
      if(rw.predicted_engagement) h+='<div class="rewrite-eng">Predicted: '+escHtml(rw.predicted_engagement)+'</div>';
      h+='</div>';
    }
  }

  if(d.hooks&&d.hooks.length){
    h+='<div class="section-label">AI-Generated Hooks</div><div class="hooks-list">';
    d.hooks.forEach((hk,i)=>{
      h+='<div class="hook-card" onclick="copyText(\''+escJs(hk)+'\')">';
      h+='<div class="hook-num" style="background:#bf5af2">'+(i+1)+'</div>';
      h+='<div class="hook-text">'+escHtml(hk)+'</div><div class="hook-copy">Copy</div></div>';
    });
    h+='</div>';
  }

  if(d.thread_strategy&&d.thread_strategy.should_thread&&d.thread_strategy.thread_outline){
    h+='<div class="section-label">Thread Strategy</div><div class="thread-card">';
    if(d.thread_strategy.why) h+='<div style="font-size:13px;color:#86868b;margin-bottom:10px">'+escHtml(d.thread_strategy.why)+'</div>';
    d.thread_strategy.thread_outline.forEach((tw,i)=>{
      h+='<div class="thread-tweet" onclick="copyText(this.innerText)"><div class="thread-num">'+(i+1)+'/'+d.thread_strategy.thread_outline.length+'</div>'+escHtml(tw)+'</div>';
    });
    h+='</div>';
  }

  if(d.posting_advice){
    h+='<div class="section-label">Posting Strategy</div><div class="advice-card">';
    for(const[k,label]of [['best_time','Best Time'],['media','Media Strategy'],['engagement_strategy','First 30 Min'],['follow_up','Follow-up Post']]){
      if(d.posting_advice[k]) h+='<div class="advice-row"><div class="adv-label">'+label+'</div>'+escHtml(d.posting_advice[k])+'</div>';
    }
    h+='</div>';
  }
  return h;
}

function saveHistory(text,score,category){
  historyArr.unshift({text:text.substring(0,100),score,category,ts:Date.now()});
  if(historyArr.length>20)historyArr=historyArr.slice(0,20);
  localStorage.setItem('ve_history',JSON.stringify(historyArr));renderHistory();
}
function renderHistory(){
  const sec=document.getElementById('historySection');const list=document.getElementById('historyList');
  if(!historyArr.length){sec.style.display='none';return}
  sec.style.display='block';let h='';
  for(const item of historyArr.slice(0,5)){
    const[c]=scoreGradient(item.score);
    h+='<div class="history-item" onclick="loadHistory(\''+escJs(item.text)+'\')">';
    h+='<div class="history-score" style="background:'+c+'22;color:'+c+'">'+(item.score*100).toFixed(0)+'</div>';
    h+='<div class="history-text">'+escHtml(item.text)+'</div></div>';
  }
  list.innerHTML=h;
}
function loadHistory(text){document.getElementById('text').value=text;updateCharCount();window.scrollTo({top:0,behavior:'smooth'})}
function clearHistory(){historyArr=[];localStorage.removeItem('ve_history');renderHistory()}
</script>
