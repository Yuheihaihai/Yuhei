# X Virality Optimization Engine Configuration

x_api:
  # Bearer token — can also be set via X_BEARER_TOKEN environment variable
  bearer_token: "***REMOVED_X_BEARER_TOKEN***"

storage:
  db_path: "data/virality.db"

nlp:
  embedding_dim: 384
  # Auto-detect sentence-transformers for better embeddings
  try_real_embeddings: true

# ML model path (null = formula-only scoring for MVP)
model_path: null
