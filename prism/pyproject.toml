[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-cdo"
version = "0.1.0"
description = "Prism — Cognitive Diversity Orchestration: bundle uncorrelated AI agents to reduce a group's blind spots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
live = ["anthropic>=0.30"]
viz = ["matplotlib>=3.7", "umap-learn>=0.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
